<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Premier League Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            purple: '#7e22ce',
                            pink: '#ec4899',
                            green: '#10b981'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            /* Slate 900 */
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(126, 34, 206, 0.2) 0%, rgba(236, 72, 153, 0.2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(236, 72, 153, 0.5);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [view, setView] = useState('dashboard'); // dashboard, players, team
            const [stats, setStats] = useState([]);
            const [loading, setLoading] = useState(true);
            const [myTeam, setMyTeam] = useState({ name: 'My FPL XI', players: [] });
            const [savedTeam, setSavedTeam] = useState(null);

            useEffect(() => {
                fetchStats();
            }, []);

            const fetchStats = async () => {
                try {
                    // Fetch latest gameweek data
                    const response = await fetch('/stats/latest');
                    const data = await response.json();
                    setStats(data);
                    setLoading(false);
                } catch (error) {
                    console.error("Failed to fetch stats", error);
                    setLoading(false);
                }
            };

            const addToTeam = (player) => {
                if (myTeam.players.find(p => p.id === player.player_id)) return; // Already in team
                if (myTeam.players.length >= 15) return; // Full

                // Can verify position limits here if needed

                setMyTeam(prev => ({ ...prev, players: [...prev.players, player] }));
            };

            const removeFromTeam = (playerId) => {
                setMyTeam(prev => ({ ...prev, players: prev.players.filter(p => p.player_id !== playerId) }));
            };

            const saveTeam = async (captainId, benchIds) => {
                try {
                    const payload = {
                        name: myTeam.name,
                        player_ids: myTeam.players.map(p => p.player_id),
                        captain_id: captainId || 0,
                        bench_ids: benchIds || []
                    };

                    const res = await fetch('/team', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        alert(err.detail);
                        return;
                    }

                    const result = await res.json();

                    // Fetch full team details to get calculated score
                    const scoreRes = await fetch(`/team/${result.team_id}`);
                    const scoreData = await scoreRes.json();

                    alert(`Team Saved! Total Gameweek Points: ${scoreData.total_score}`);
                    setSavedTeam(scoreData);
                } catch (e) {
                    alert("Error saving team");
                }
            };

            return (
                <div className="min-h-screen p-6 max-w-7xl mx-auto">
                    {/* Header */}
                    <header className="flex justify-between items-center mb-8 glass-panel p-6">
                        <div>
                            <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-purple to-brand-pink">
                                Fantasy Pro
                            </h1>
                            <p className="text-slate-400 text-sm">Latest Gameweek Analysis</p>
                        </div>
                        <nav className="flex gap-4">
                            <button
                                onClick={() => setView('dashboard')}
                                className={`px-4 py-2 rounded-lg transition ${view === 'dashboard' ? 'bg-brand-purple text-white' : 'text-slate-400 hover:text-white'}`}
                            >
                                Dashboard
                            </button>
                            <button
                                onClick={() => setView('players')}
                                className={`px-4 py-2 rounded-lg transition ${view === 'players' ? 'bg-brand-purple text-white' : 'text-slate-400 hover:text-white'}`}
                            >
                                All Players
                            </button>
                            <button
                                onClick={() => setView('leaderboard')}
                                className={`px-4 py-2 rounded-lg transition ${view === 'leaderboard' ? 'bg-brand-purple text-white' : 'text-slate-400 hover:text-white border-b-2 border-transparent hover:border-brand-pink'}`}
                            >
                                🏆 Leaderboard
                            </button>
                            <button
                                onClick={() => setView('team')}
                                className={`px-4 py-2 rounded-lg transition ${view === 'team' ? 'bg-brand-purple text-white' : 'text-slate-400 hover:text-white border border-brand-purple'}`}
                            >
                                My Team
                            </button>
                        </nav>
                    </header>

                    {/* Content */}
                    {loading ? (
                        <div className="flex justify-center items-center h-64">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-pink"></div>
                        </div>
                    ) : (
                        view === 'dashboard' ? <Dashboard stats={stats} /> :
                            view === 'players' ? <PlayerList stats={stats} /> :
                                view === 'leaderboard' ? <LeaderboardView /> :
                                    <TeamBuilder stats={stats} myTeam={myTeam} addToTeam={addToTeam} removeFromTeam={removeFromTeam} saveTeam={saveTeam} savedTeam={savedTeam} />
                    )}
                </div>
            );
        }

        function TeamBuilder({ stats, myTeam, addToTeam, removeFromTeam, saveTeam, savedTeam }) {
            const [captainId, setCaptainId] = useState(null);

            // Auto-select a captain to prevent Save Team button remaining disabled
            useEffect(() => {
                if (myTeam.players.length > 0 && !captainId) {
                    setCaptainId(myTeam.players[0].player_id);
                }
            }, [myTeam.players, captainId]);

            const budget = 150.0;
            const usedBudget = myTeam.players.reduce((sum, p) => sum + (p.cost || 0), 0);

            const remaining = (budget - usedBudget).toFixed(1);

            // Logic to separate starting 11 from 4 bench players (15 total limit enforced above)
            // Rules: Exactly 1 GK in starting 11. Total 11 starters. 4 on bench.
            const startingXI = [];
            const bench = [];
            let gkCount = 0;

            myTeam.players.forEach(p => {
                if (startingXI.length < 11) {
                    if (p.position_id === 1) {
                        if (gkCount === 0) {
                            startingXI.push(p);
                            gkCount++;
                        } else {
                            bench.push(p);
                        }
                    } else {
                        startingXI.push(p);
                    }
                } else {
                    bench.push(p);
                }
            });

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Sidebar Player Picker */}
                    <div className="lg:col-span-1 glass-panel p-6 h-[800px] overflow-y-auto">
                        <h3 className="text-xl font-bold mb-4">Select Players</h3>
                        <PlayerPicker stats={stats} onAdd={addToTeam} team={myTeam.players} />
                    </div>

                    {/* Pitch / Team View */}
                    <div className="lg:col-span-2 space-y-6">
                        {savedTeam && (
                            <div className="glass-panel p-4 bg-brand-purple text-white text-center rounded-lg font-bold text-2xl shadow-[0_0_15px_rgba(126,34,206,0.5)] border-brand-pink border-2">
                                🏆 Official Gameweek Score: {savedTeam.total_score} Points 🏆
                            </div>
                        )}
                        {/* Budget Bar */}
                        <div className="glass-panel p-6 flex justify-between items-center">
                            <div>
                                <div className="text-sm text-slate-400">Budget Remaining</div>
                                <div className={`text-2xl font-bold ${remaining < 0 ? 'text-red-500' : 'text-brand-green'}`}>
                                    £{remaining}m
                                </div>
                            </div>
                            <div>
                                <div className="text-sm text-slate-400">Selected</div>
                                <div className="text-2xl font-bold">{myTeam.players.length} / 15</div>
                            </div>
                            <button
                                onClick={() => {
                                    const benchIds = bench.map(p => p.player_id);
                                    saveTeam(captainId, benchIds);
                                }}
                                disabled={myTeam.players.length !== 15 || remaining < 0 || !captainId}
                                className="bg-brand-purple hover:bg-brand-pink text-white px-6 py-2 rounded-lg font-bold disabled:opacity-50 disabled:cursor-not-allowed transition"
                            >
                                Save Team
                            </button>
                        </div>

                        <div className="glass-panel p-8 min-h-[500px] relative bg-gradient-to-b from-green-900/20 to-green-900/40 border-green-900/30">
                            {/* Simple Pitch Layout Visualization */}
                            <div className="text-center text-slate-200 font-bold mb-6 text-xl tracking-wider">STARTING XI</div>

                            <div className="space-y-6">
                                <PositionRow label="Goalkeeper" type={1} players={startingXI} onRemove={removeFromTeam} captainId={captainId} setCaptainId={setCaptainId} />
                                <PositionRow label="Defenders" type={2} players={startingXI} onRemove={removeFromTeam} captainId={captainId} setCaptainId={setCaptainId} />
                                <PositionRow label="Midfielders" type={3} players={startingXI} onRemove={removeFromTeam} captainId={captainId} setCaptainId={setCaptainId} />
                                <PositionRow label="Forwards" type={4} players={startingXI} onRemove={removeFromTeam} captainId={captainId} setCaptainId={setCaptainId} />
                            </div>
                        </div>

                        {/* The Bench */}
                        <div className="glass-panel p-6 border-slate-700 bg-slate-900/40">
                            <div className="text-center text-slate-400 font-bold mb-4 text-sm tracking-widest">SUBSTITUTES (BENCH)</div>
                            <div className="flex gap-4 justify-center flex-wrap">
                                {bench.length === 0 && <div className="w-full text-center text-slate-600 text-xs italic py-4">Bench is empty</div>}
                                {bench.map(player => (
                                    <div key={player.id} className="relative group grayscale hover:grayscale-0 transition-all">
                                        <div className="w-24 h-32 bg-slate-800/80 rounded-lg p-2 flex flex-col items-center justify-center border border-slate-700">
                                            <div className="text-[10px] pb-1 font-bold text-slate-400">{player.position_id === 1 ? 'GKP' : player.position_id === 2 ? 'DEF' : player.position_id === 3 ? 'MID' : 'FWD'}</div>
                                            <div className="font-bold text-xs text-center mb-1">{player.second_name}</div>
                                            <div className="text-brand-pink font-mono text-[10px]">£{player.cost || '??'}</div>
                                        </div>
                                        <button
                                            onClick={() => removeFromTeam(player.player_id)}
                                            className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            )
        }

        function PositionRow({ label, type, players, onRemove, captainId, setCaptainId }) {
            const p = players.filter(pl => pl.position_id === type);
            return (
                <div className="flex flex-col items-center">
                    {/* <div className="text-xs text-slate-500 mb-2 uppercase tracking-widest">{label}</div> */}
                    <div className="flex gap-4 justify-center flex-wrap">
                        {p.length === 0 && <div className="w-24 h-32 border-2 border-dashed border-slate-700 rounded-lg flex items-center justify-center text-slate-700 text-xs">Empty</div>}
                        {p.map(player => (
                            <div key={player.id} className="relative group">
                                <div className={`w-28 h-36 rounded-lg p-2 flex flex-col items-center justify-center border shadow-xl ${captainId === player.player_id ? 'bg-slate-700 border-yellow-500' : 'bg-slate-800 border-slate-700'}`}>
                                    {captainId === player.player_id ? (
                                        <div className="absolute top-1 left-1 bg-yellow-500 text-black text-[10px] font-bold px-1.5 rounded">C</div>
                                    ) : (
                                        <button onClick={() => setCaptainId(player.player_id)} className="absolute top-1 left-1 bg-slate-700 text-white text-[10px] px-1.5 rounded opacity-0 group-hover:opacity-100 hover:bg-yellow-500 hover:text-black transition">C</button>
                                    )}
                                    <div className="text-xs text-slate-400 mb-1">{player.team}</div>
                                    <div className="font-bold text-sm text-center mb-1">{player.second_name}</div>
                                    <div className="text-brand-pink font-mono text-xs">£{player.cost || '??'}</div>
                                    <div className="mt-2 text-xs bg-slate-900 px-2 py-1 rounded text-green-400">{player.total_points} pts</div>
                                </div>
                                <button
                                    onClick={() => onRemove(player.player_id)}
                                    className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition"
                                >
                                    ✕
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            )
        }

        function PlayerPicker({ stats, onAdd, team }) {
            const [search, setSearch] = useState('');
            const [activeTab, setActiveTab] = useState('ALL'); // ALL, 1 (GK), 2 (DEF), 3 (MID), 4 (FWD)
            const teamIds = new Set(team.map(p => p.player_id));

            const filtered = stats.filter(s => {
                if (teamIds.has(s.player_id)) return false;

                const matchesSearch = (s.first_name + ' ' + s.second_name).toLowerCase().includes(search.toLowerCase()) ||
                    s.team.toLowerCase().includes(search.toLowerCase());

                const matchesPosition = activeTab === 'ALL' || s.position_id === parseInt(activeTab);

                return matchesSearch && matchesPosition;
            }).sort((a, b) => (b.cost || 0) - (a.cost || 0));

            return (
                <div className="flex flex-col h-full">
                    <input
                        className="w-full bg-slate-900 border border-slate-700 rounded p-2 mb-3 text-sm"
                        placeholder="Search players or teams..."
                        value={search}
                        onChange={e => setSearch(e.target.value)}
                    />

                    {/* Position Filters */}
                    <div className="flex gap-1 flex-wrap mb-4 bg-slate-900/50 p-1 rounded-lg border border-slate-800">
                        {['ALL', '1', '2', '3', '4'].map(tab => (
                            <button
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`flex-1 py-1.5 text-xs font-bold rounded transition ${activeTab === tab
                                    ? 'bg-brand-purple text-white shadow'
                                    : 'text-slate-400 hover:text-white hover:bg-slate-800'
                                    }`}
                            >
                                {tab === 'ALL' ? 'ALL' : tab === '1' ? 'GKP' : tab === '2' ? 'DEF' : tab === '3' ? 'MID' : 'FWD'}
                            </button>
                        ))}
                    </div>

                    <div className="space-y-2 overflow-y-auto flex-1 pr-1 pb-4">
                        {filtered.slice(0, 50).map(player => (
                            <div key={player.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800 hover:border-slate-600 transition">
                                <div>
                                    <div className="text-sm font-bold truncate max-w-[140px]">{player.second_name}</div>
                                    <div className="text-xs text-slate-500 whitespace-nowrap">
                                        <span className={player.position_id === 1 ? 'text-yellow-500' : player.position_id === 2 ? 'text-blue-400' : player.position_id === 3 ? 'text-green-400' : 'text-red-400'}>
                                            {player.position_id === 1 ? 'GKP' : player.position_id === 2 ? 'DEF' : player.position_id === 3 ? 'MID' : 'FWD'}
                                        </span>
                                        <span className="mx-1">•</span>
                                        {player.team.slice(0, 3).toUpperCase()}
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="text-sm font-mono text-brand-pink font-semibold">£{player.cost || '??'}</div>
                                    <button
                                        onClick={() => onAdd(player)}
                                        className="h-8 w-8 bg-slate-800 hover:bg-brand-purple rounded-full flex items-center justify-center text-white font-bold transition shadow-sm"
                                        title="Add Player"
                                    >
                                        +
                                    </button>
                                </div>
                            </div>
                        ))}
                        {filtered.length === 0 && (
                            <div className="text-center text-slate-500 py-8 text-sm">No players found matching your criteria.</div>
                        )}
                    </div>
                </div>
            )
        }

        function Dashboard({ stats }) {
            // Calculate top performers
            const topScorers = [...stats].sort((a, b) => b.total_points - a.total_points).slice(0, 5);
            const topGoals = [...stats].sort((a, b) => b.goals - a.goals).slice(0, 5);
            const topICT = [...stats].sort((a, b) => b.ict_index - a.ict_index).slice(0, 5);

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {/* Top Scorer Card */}
                    <div className="col-span-1 md:col-span-2 lg:col-span-3 glass-panel p-8 mb-4 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-brand-purple rounded-full blur-3xl opacity-20 -mr-20 -mt-20"></div>
                        <h2 className="text-2xl font-bold mb-6">Latest GW MVP</h2>
                        {topScorers[0] && (
                            <div className="flex items-center gap-6">
                                <div className="h-24 w-24 rounded-full bg-gradient-to-br from-brand-purple to-brand-pink flex items-center justify-center text-4xl font-bold">
                                    {topScorers[0].total_points}
                                </div>
                                <div>
                                    <h3 className="text-4xl font-bold">{topScorers[0].first_name} {topScorers[0].second_name}</h3>
                                    <p className="text-xl text-brand-green">{topScorers[0].team} • {topScorers[0].position_id === 1 ? 'GK' : topScorers[0].position_id === 2 ? 'DEF' : topScorers[0].position_id === 3 ? 'MID' : 'FWD'}</p>
                                    <p className="text-slate-400 mt-2">
                                        vs {topScorers[0].opponent} ({topScorers[0].venue}) • Result: {topScorers[0].result}
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>

                    <TopList title="Most Points" data={topScorers} metric="total_points" />
                    <TopList title="Top Goalscorers" data={topGoals} metric="goals" />
                    <TopList title="Highest ICT" data={topICT} metric="ict_index" />
                </div>
            );
        }

        function TopList({ title, data, metric }) {
            return (
                <div className="glass-panel p-6 stat-card">
                    <h3 className="text-xl font-semibold mb-4 text-slate-200">{title}</h3>
                    <div className="space-y-4">
                        {data.map((p, i) => (
                            <div key={p.id || i} className="flex justify-between items-center bg-slate-800/50 p-3 rounded-lg">
                                <div className="flex items-center gap-3">
                                    <span className="text-slate-500 font-mono">#{i + 1}</span>
                                    <div>
                                        <div className="font-semibold text-sm">{p.second_name}</div>
                                        <div className="text-xs text-slate-500">{p.team}</div>
                                    </div>
                                </div>
                                <div className="text-brand-pink font-bold">
                                    {p[metric]}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )
        }

        function PlayerList({ stats }) {
            const [filter, setFilter] = useState('');
            const filtered = stats.filter(s =>
                (s.first_name + ' ' + s.second_name).toLowerCase().includes(filter.toLowerCase()) ||
                s.team.toLowerCase().includes(filter.toLowerCase())
            );

            return (
                <div className="glass-panel p-6">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold">Player Stats</h2>
                        <input
                            type="text"
                            placeholder="Search players..."
                            className="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-brand-purple w-64"
                            value={filter}
                            onChange={(e) => setFilter(e.target.value)}
                        />
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left text-slate-400">
                            <thead className="text-xs text-slate-200 uppercase bg-slate-800/50">
                                <tr>
                                    <th className="px-6 py-3">Player</th>
                                    <th className="px-6 py-3">Team</th>
                                    <th className="px-6 py-3">Opponent</th>
                                    <th className="px-6 py-3">Points</th>
                                    <th className="px-6 py-3">Goals</th>
                                    <th className="px-6 py-3">Assists</th>
                                    <th className="px-6 py-3">Mins</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.slice(0, 50).map((s) => (
                                    <tr key={s.id} className="border-b border-slate-700 hover:bg-slate-800/30">
                                        <td className="px-6 py-4 font-medium text-white">
                                            {s.first_name} {s.second_name}
                                        </td>
                                        <td className="px-6 py-4">{s.team}</td>
                                        <td className="px-6 py-4">
                                            {s.opponent} <span className="text-xs opacity-50">({s.venue})</span>
                                        </td>
                                        <td className="px-6 py-4 font-bold text-brand-pink">{s.total_points}</td>
                                        <td className="px-6 py-4 ">{s.goals}</td>
                                        <td className="px-6 py-4">{s.assists}</td>
                                        <td className="px-6 py-4">{s.minutes}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <div className="text-center mt-4 text-xs text-slate-500">
                        Showing top 50 matches
                    </div>
                </div>
            );
        }

        function LeaderboardView() {
            const [rankings, setRankings] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                fetchLeaderboard();
            }, []);

            const fetchLeaderboard = async () => {
                try {
                    const res = await fetch('/leaderboard');
                    const data = await res.json();
                    setRankings(data);
                    setLoading(false);
                } catch (e) {
                    console.error(e);
                    setLoading(false);
                }
            };

            if (loading) return <div className="text-center p-10">Loading Rankings...</div>;

            return (
                <div className="max-w-4xl mx-auto">
                    <div className="glass-panel p-8">
                        <div className="text-center mb-10">
                            <h2 className="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-yellow-600 mb-2">Global Leaderboard</h2>
                            <p className="text-slate-400">Singleton & Observer Pattern Real-time Standings</p>
                        </div>

                        <div className="flex flex-col gap-3">
                            {rankings.length === 0 && <div className="text-center text-slate-500 py-10">No teams created yet.</div>}

                            {rankings.map((team, idx) => (
                                <div key={team.id} className={`flex items-center justify-between p-4 rounded-xl border ${idx === 0 ? 'bg-yellow-900/30 border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.3)]' : idx === 1 ? 'bg-slate-800/60 border-slate-400' : idx === 2 ? 'bg-orange-900/30 border-orange-500' : 'bg-slate-900/60 border-slate-800'}`}>
                                    <div className="flex items-center gap-6">
                                        <div className={`text-3xl font-bold w-12 text-center ${idx === 0 ? 'text-yellow-400' : idx === 1 ? 'text-slate-300' : idx === 2 ? 'text-orange-400' : 'text-slate-600'}`}>
                                            #{idx + 1}
                                        </div>
                                        <div>
                                            <div className="text-xl font-bold text-slate-100">{team.name}</div>
                                            <div className="text-sm text-slate-500">Budget Used: £{team.budget}m</div>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-3xl font-black text-brand-pink">{team.score}</div>
                                        <div className="text-xs text-slate-400 uppercase tracking-widest mt-1">Points</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
